<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3D Fabrica - Professional fabric visualization platform for upholstery and curtain fabrics" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Open Graph / Social Media Tags -->
    <meta property="og:title" content="3D Fabrica - Fabric Visualization Platform" />
    <meta property="og:description" content="Upload, visualize, and present fabrics in realistic 3D environments" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://3-d-fabrica.vercel.app" />
    
    <title>3D Fabrica - Fabric Visualization Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("GLOBAL ERROR CAPTURED:", { message, source, lineno, colno, error });
        const debugDiv = document.createElement('div');
        debugDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:9999;font-family:monospace;white-space:pre-wrap;';
        debugDiv.textContent = "CRITICAL RUNTIME ERROR:\n" + message + "\n\nStack:\n" + (error ? error.stack : "N/A");
        document.body.appendChild(debugDiv);
      };
      window.onunhandledrejection = function(event) {
        console.error("UNHANDLED PROMISE REJECTION:", event.reason);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://api.tempolabs.ai/proxy-asset?url=https://storage.googleapis.com/tempo-public-assets/error-handling.js"></script>
  </body>
</html>
